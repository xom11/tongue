[package]
name = "tongue"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Memory",
  # ProcessIdToSessionId + GetCurrentProcessId: phát hiện session 0 (service/SSH), nơi
  # window station và namespace `Local\` không phải của người dùng — xem vkey.rs.
  "Win32_System_RemoteDesktop",
  # CreateProcessW (spawn không thừa kế handle) nằm trong Win32_System_Threading, nhưng
  # windows-sys chỉ phát ra nó khi CÓ CẢ Win32_Security: signature của nó tham chiếu
  # SECURITY_ATTRIBUTES. Thiếu feature này thì lỗi là "unresolved import CreateProcessW",
  # không hề nhắc tới Security.
  "Win32_System_Threading",
  "Win32_Security",
  # LoadKeyboardLayoutW + GetKeyboardLayout: doi input locale cho mode zh.
  "Win32_UI_Input_KeyboardAndMouse",
    # Named pipe: cau duy nhat qua ranh gioi session. `\\.\pipe\` la namespace TOAN
    # MAY, khac han `Local\` (thuc chat `Session\<n>\`) va khac han window station.
    # Da do tren a14 20/08/2026 voi ACL MAC DINH: server o session 1 tao pipe, client
    # o session 0 (SSH) mo duoc va trao doi hai chieu. Xem src/backend/windows/pipe.rs.
    # Pipes cho Create/Connect/Disconnect/WaitNamedPipe; FileSystem cho
    # CreateFileW/ReadFile/WriteFile tren chinh handle pipe do.
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    # ReadFile/WriteFile/ConnectNamedPipe deu nhan `*mut OVERLAPPED`, ma OVERLAPPED
    # nam trong Win32_System_IO -- thieu feature nay thi loi la "no `ReadFile` in
    # Win32::Storage::FileSystem", khong he nhac toi IO. Cung mot cai bay nhu
    # CreateProcessW can Win32_Security o tren.
    "Win32_System_IO",
    # ConvertStringSecurityDescriptorToSecurityDescriptorW + ConvertSidToStringSidW:
    # DACL tường minh cho pipe, và tên pipe theo SID. Đây là feature DUY NHẤT phải thêm
    # cho cả cầu named pipe — GetTokenInformation/TOKEN_USER/SECURITY_ATTRIBUTES đã có
    # trong Win32_Security, OpenProcessToken/OpenProcess trong Win32_System_Threading,
    # WTSGetActiveConsoleSessionId trong Win32_System_RemoteDesktop, còn LocalFree thì
    # nằm ở Win32_Foundation. Cùng cái bẫy như CreateProcessW ở trên: tên feature không
    # suy ra được từ thông báo lỗi.
    "Win32_Security_Authorization",
] }
